<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Иконка шестерни / чипа / ключа -->
    <rect x="6" y="8" width="44" height="44" rx="12" fill="url(#logoGrad)" />
    <!-- Символ микросхемы и инструментов -->
    <path d="M28 17L37 34H19L28 17Z" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="28" cy="30" r="3" fill="#ffffff" />
    <path d="M12 28H16 M40 28H44 M28 12V16 M28 40V44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Текст FIXTECH -->
    <text x="62" y="32" font-family="'Unbounded', sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">
        FIX<tspan fill="#38bdf8">TECH</tspan>
    </text>
    <text x="63" y="46" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="1.8">
        СЕРВИСНЫЙ ЦЕНТР
    </text>
</svg>
